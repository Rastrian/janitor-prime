# Continuous integration (PLAN §3 F0.5).
#
# gates      — fmt + clippy (-D warnings; default and --all-features) + test
#              + no-default-features build, on the MSRV (1.90.0) and stable.
#              The --all-features legs include the `spikes` feature, so the
#              F1 spike code is linted with the same deny set.
# pin-check  — the ABI fence (PLAN F0.6 / KP-5 / ADR-0015 / R1): lang-all
#              build against tree-sitter 0.27.0, plus a --version envelope
#              assertion so the embedded grammar list is exercised for real.
# spikes     — F1 kill-point fence (PLAN §3 F1): build + test with
#              --features spikes so the measurement harnesses keep compiling
#              until they are deleted at F3 entry. The feature is
#              deliberately absent from default and from lang-all.
# musl-smoke — best-effort static musl build: cargo-zigbuild preferred,
#              musl-gcc fallback (decision recorded in PLAN Appendix A.5);
#              continue-on-error per F0.5.
# supply-chain — PLAN §10 / F7.2: cargo-deny (license allow list from
#              deny.toml + RustSec advisories + bans + sources) and
#              cargo-audit over Cargo.lock, both installed from source
#              with --locked (first-party cargo install — no new
#              third-party actions to pin).
# lang-experimental — F9c: build + test the experimental tier
#              (ruby + ocaml/ocaml_interface) in ONE job, deliberately
#              OUTSIDE the gates matrix and OUTSIDE lang-all (ADR-0015
#              appended note): the stable set's fences stay untouched
#              while the tier's registry, trivia corpora, norm tables
#              and e2e acceptances run on every PR.
#
# Supply chain: all third-party actions pinned by commit SHA (PLAN §10).

name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  gates:
    name: gates (${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain: ["1.90.0", "stable"]
    env:
      # Takes precedence over rust-toolchain.toml (which pins 1.98.0 for
      # local dev) so each leg tests the toolchain it claims.
      RUSTUP_TOOLCHAIN: ${{ matrix.toolchain }}
    steps:
      - name: Checkout (actions/checkout v7.0.1)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Toolchain (dtolnay/rust-toolchain@master)
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy
      - name: Cache (Swatinem/rust-cache v2.9.2)
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: rustfmt
        run: cargo fmt --check
      - name: clippy (default features)
        run: cargo clippy --all-targets -- -D warnings
      - name: clippy (all features = lang-all)
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: test
        run: cargo test
      - name: test (lang-python e2e)
        # F9a: python joins the tested set — the registry, KP-6-python
        # trivia corpus, norm-table conformance, the python agent-loop
        # acceptance and the python determinism fence all run on every PR
        # (the second-language guarantee, not just "grammar compiles" —
        # that stays pin-check's job via lang-all).
        run: cargo test --features lang-python
      - name: test (lang-go e2e)
        # F9b: go joins the tested set — the registry, KP-6-go trivia
        # corpus, go norm table, the go agent-loop acceptance and the go
        # determinism fence leg run on every PR.
        run: cargo test --features lang-go
      - name: test (lang-typescript e2e)
        # F9b: typescript AND tsx join the tested set — the registry
        # (including the tsx LangId routing fence), KP-6-typescript
        # trivia corpus, the shared norm table (conformance-checked
        # against BOTH grammars), the ts/tsx agent-loop acceptance and
        # the cross-grammar determinism fence leg.
        run: cargo test --features lang-typescript
      - name: build with no default features
        run: cargo build --no-default-features

  pin-check:
    name: lang-all ABI pin-check (KP-5 fence)
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - name: Checkout (actions/checkout v7.0.1)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Toolchain (dtolnay/rust-toolchain@master)
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: stable
      - name: Cache (Swatinem/rust-cache v2.9.2)
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: Build all grammars against tree-sitter 0.27.0
        run: cargo build --features lang-all
      - name: "--version envelope lists all eight grammars"
        # F9b: the lang-typescript feature registers TWO grammars
        # (typescript + tsx), so lang-all surfaces eight entries.
        run: |
          ./target/debug/janitor --version | jq -e '
            .schema == "janitor.v1"
            and .ok == true
            and .data.grammars == ["rust","python","go","javascript","typescript","tsx","java","c"]
          '

  spikes:
    name: F1 spikes fence (build + test)
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - name: Checkout (actions/checkout v7.0.1)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Toolchain (dtolnay/rust-toolchain@master)
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: stable
      - name: Cache (Swatinem/rust-cache v2.9.2)
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: Build with --features spikes
        run: cargo build --features spikes
      - name: Test with --features spikes
        # Heavy measurement legs are #[ignore]d; this runs the fast
        # correctness fences of every spike (PLAN §3 F1 gate).
        run: cargo test --features spikes

  supply-chain:
    name: supply chain (cargo-deny + cargo-audit)
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - name: Checkout (actions/checkout v7.0.1)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Toolchain (dtolnay/rust-toolchain@master)
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: stable
      - name: Cache (Swatinem/rust-cache v2.9.2)
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: Install cargo-deny and cargo-audit (--locked, from source)
        run: |
          cargo install cargo-deny --locked
          cargo install cargo-audit --locked
      - name: cargo-deny (licenses, advisories, bans, sources)
        # deny.toml carries the license allow list and the advisory gate;
        # --all-features so lang-all's grammar crates are covered too.
        run: cargo deny --all-features check
      - name: cargo-audit (RustSec over Cargo.lock)
        # Independent second pass over the same advisory database, straight
        # at the lockfile; fails on any vulnerability.
        run: cargo audit

  lang-experimental:
    name: experimental tier (ruby + ocaml)
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - name: Checkout (actions/checkout v7.0.1)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Toolchain (dtolnay/rust-toolchain@master)
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: stable
      - name: Cache (Swatinem/rust-cache v2.9.2)
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: Build the experimental tier
        run: cargo build --features lang-experimental
      - name: Test the experimental tier
        # The registry paths, KP-6-ruby/ocaml trivia corpora, norm-table
        # conformance and both e2e acceptances are all feature-gated on
        # their languages — one test run covers the whole tier.
        run: cargo test --features lang-experimental
      - name: "--version envelope lists the experimental grammar set"
        run: |
          ./target/debug/janitor --version | jq -e '
            .schema == "janitor.v1"
            and .ok == true
            and .data.grammars == ["rust","ruby","ocaml","ocaml_interface"]
          '

  musl-smoke:
    name: musl static build smoke (best-effort)
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - name: Checkout (actions/checkout v7.0.1)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Toolchain (dtolnay/rust-toolchain@master)
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-musl
      - name: Cache (Swatinem/rust-cache v2.9.2)
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: cargo-zigbuild (preferred)
        id: zigbuild
        run: |
          python3 -m venv /tmp/zigvenv
          /tmp/zigvenv/bin/python -m pip install ziglang
          export PATH="/tmp/zigvenv/bin:$PATH"
          cargo install cargo-zigbuild --locked
          cargo zigbuild --release --target x86_64-unknown-linux-musl --features lang-all
      - name: musl-gcc fallback
        if: ${{ failure() && steps.zigbuild.outcome == 'failure' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          cargo build --release --target x86_64-unknown-linux-musl --features lang-all
      - name: "Smoke: static binary emits the envelope"
        run: |
          file target/x86_64-unknown-linux-musl/release/janitor
          target/x86_64-unknown-linux-musl/release/janitor --version \
            | jq -e '.schema == "janitor.v1" and .ok == true'
