[package]
name = "janitor-prime"
version = "0.3.0"
edition = "2024"
rust-version = "1.90"            # tree-sitter 0.27.0 MSRV (crates.io rust_version, verified 2026-09-13); clap 4.6.6 (1.85) and edition 2024 (1.85) sit below the binding floor
license = "MIT OR Apache-2.0"
repository = "https://github.com/Rastrian/janitor-prime"
description = "Deterministic refactoring engine, transactional VFS and persistent memory for autonomous agents"
build = "build.rs"               # embeds grammar list for --version JSON

[[bin]]
name = "janitor"
path = "src/main.rs"

[dependencies]
# --- CLI & serialization ---
clap = { version = "=4.6.6", features = ["derive"] }   # derive is NOT a default feature (verified)
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
thiserror = "=2.0.20"                                   # 2.x is current; last 1.x = 1.0.69

# --- engine ---
tree-sitter = "=0.27.0"            # 2026-08-30; parse_with_options era (parse_with removed in 0.26)
tree-sitter-language = "=0.1.8"    # grammar crates' only runtime dep; same-day release as core 0.27.0
rayon = "=1.12.0"
smol_str = "=0.3.6"                # interned kind names backing store (crates.io name is smol_str; PLAN §2 writes smol-str)
dashmap = "=6.2.1"                 # ParseCache concurrent inserts from rayon workers

# --- diagnostics (stderr only; stdout stays 100% JSON) ---
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }

# --- grammars: one feature per language; rust ships in the default set (ADR-0015) ---
tree-sitter-rust = { version = "=0.24.2", optional = true }        # ABI 15
tree-sitter-python = { version = "=0.25.0", optional = true }      # ABI 15
tree-sitter-go = { version = "=0.25.0", optional = true }          # ABI 15
tree-sitter-javascript = { version = "=0.25.0", optional = true }  # ABI 15
tree-sitter-typescript = { version = "=0.23.2", optional = true }  # ABI 14
tree-sitter-java = { version = "=0.23.5", optional = true }        # ABI 14
tree-sitter-c = { version = "=0.24.2", optional = true }           # ABI 15

# --- experimental tier (F9c/F9d, ADR-0015 note): registered and e2e-tested
# but NOT part of lang-all — the stable-set fence stays at seven grammars
# until each experimental grammar's trivia corpus is fully curated ---
tree-sitter-ruby = { version = "=0.23.1", optional = true }         # ABI 14
tree-sitter-ocaml = { version = "=0.26.0", optional = true }        # ABI 15 (ocaml + ocaml_interface + ocaml_type)
tree-sitter-elixir = { version = "=0.3.5", optional = true }        # ABI 14 (elixir-lang org; scanner.c = quoted-content splitting, verified 2026-09-15)

[features]
default = ["lang-rust"]
lang-rust = ["dep:tree-sitter-rust"]
lang-python = ["dep:tree-sitter-python"]
lang-go = ["dep:tree-sitter-go"]
lang-javascript = ["dep:tree-sitter-javascript"]
lang-typescript = ["dep:tree-sitter-typescript"]
lang-java = ["dep:tree-sitter-java"]
lang-c = ["dep:tree-sitter-c"]
lang-all = ["lang-rust", "lang-python", "lang-go", "lang-javascript",
            "lang-typescript", "lang-java", "lang-c"]
# Experimental tier (F9c+F9d): ruby/ocaml/elixir build+test here; lang-all
# stays the "stable set" ABI fence (ADR-0015 appended note). Promotion =
# move the feature into lang-all when its trivia corpus is fully curated.
lang-ruby = ["dep:tree-sitter-ruby"]
lang-ocaml = ["dep:tree-sitter-ocaml"]
lang-elixir = ["dep:tree-sitter-elixir"]
lang-experimental = ["lang-ruby", "lang-ocaml", "lang-elixir"]
# F1 kill-point spikes (PLAN §3 F1): self-contained measurement harnesses,
# compiled only on demand and deleted at F3 entry. Deliberately NOT default
# and NOT part of `lang-all` — a dedicated CI job builds/tests this feature
# so the spike code keeps compiling for as long as it lives.
spikes = ["lang-rust"]

[dev-dependencies]
tempfile = "=3.27.0"
proptest = "=1.11.0"               # PLAN §2 pins 1.8.2 — never published; real latest pinned instead
criterion = "=0.8.2"               # PLAN §2 pins 0.11.0 — never published; real latest pinned instead

[build-dependencies]
# nothing; build.rs is std-only

[[bench]]
name = "engine"
harness = false

[[bench]]
name = "matcher_linearity"
harness = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"        # policy: no panics in production; abort shrinks the static binary
